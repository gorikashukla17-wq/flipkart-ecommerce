# Optional: a local MySQL 8 for running ShopKart against a real server.
#   docker compose up -d
#   export SHOPKART_DB_URL="jdbc:mysql://localhost:3306/shopkart"
#   export SHOPKART_DB_USER=shop SHOPKART_DB_PASSWORD=shop
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: shopkart
      MYSQL_USER: shop
      MYSQL_PASSWORD: shop
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
